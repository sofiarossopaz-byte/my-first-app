<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#080d1b">
    <title>Contador de Eventos | Colegio Bolívar</title>

    <style>
        :root {
            --fondo: #080d1b;
            --tarjeta: #111a2e;
            --azul-neon: #00e5ff;
            --verde-neon: #39ff88;
            --rosa-neon: #ff3cac;
            --texto: #f1f5f9;
            --texto-secundario: #94a3b8;
            --borde: rgba(0, 229, 255, 0.2);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
            font-family: "Inter", "Segoe UI", Roboto, Arial, sans-serif;
            background:
                radial-gradient(
                    circle at 15% 15%,
                    rgba(0, 229, 255, 0.09),
                    transparent 35%
                ),
                radial-gradient(
                    circle at 85% 85%,
                    rgba(255, 60, 172, 0.08),
                    transparent 35%
                ),
                var(--fondo);
            color: var(--texto);
        }

        .contenedor {
            width: 100%;
            max-width: 440px;
            padding: 40px 30px;
            text-align: center;
            background: rgba(17, 26, 46, 0.95);
            border: 1px solid var(--borde);
            border-radius: 24px;
            box-shadow:
                0 0 35px rgba(0, 229, 255, 0.07),
                0 20px 60px rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(12px);
        }

        .etiqueta {
            display: inline-block;
            margin-bottom: 18px;
            padding: 7px 13px;
            border: 1px solid rgba(0, 229, 255, 0.3);
            border-radius: 30px;
            color: var(--azul-neon);
            background: rgba(0, 229, 255, 0.06);
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        h1 {
            margin-bottom: 12px;
            font-size: clamp(25px, 6vw, 32px);
            font-weight: 800;
            letter-spacing: -1px;
        }

        h1 span {
            color: var(--azul-neon);
            text-shadow: 0 0 15px rgba(0, 229, 255, 0.35);
        }

        .descripcion {
            margin-bottom: 35px;
            color: var(--texto-secundario);
            font-size: 14px;
            line-height: 1.6;
        }

        .contador-panel {
            padding: 25px 15px;
            margin-bottom: 25px;
            background: rgba(5, 10, 23, 0.7);
            border: 1px solid rgba(0, 229, 255, 0.12);
            border-radius: 18px;
        }

        .contador-label {
            color: var(--texto-secundario);
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .contador {
            margin: 15px 0;
            color: var(--azul-neon);
            font-size: clamp(65px, 15vw, 86px);
            font-weight: 800;
            line-height: 1.1;
            font-variant-numeric: tabular-nums;
            text-shadow:
                0 0 10px rgba(0, 229, 255, 0.45),
                0 0 30px rgba(0, 229, 255, 0.15);
            transition: transform 0.2s ease;
        }

        .contador.animar {
            transform: scale(1.08);
        }

        .estado {
            min-height: 20px;
            color: var(--verde-neon);
            font-size: 13px;
        }

        .botones {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        button {
            width: 100%;
            min-height: 52px;
            padding: 14px 18px;
            border: 1px solid transparent;
            border-radius: 12px;
            font-family: inherit;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease,
                background 0.2s ease;
        }

        button:hover {
            transform: translateY(-2px);
        }

        button:active {
            transform: scale(0.98);
        }

        button:focus-visible {
            outline: 2px solid white;
            outline-offset: 4px;
        }

        .boton-sumar {
            color: #03131b;
            background: var(--azul-neon);
            box-shadow: 0 0 18px rgba(0, 229, 255, 0.2);
        }

        .boton-sumar:hover {
            background: #65efff;
            box-shadow: 0 0 28px rgba(0, 229, 255, 0.4);
        }

        .boton-restar {
            color: var(--verde-neon);
            background: rgba(57, 255, 136, 0.06);
            border-color: rgba(57, 255, 136, 0.35);
        }

        .boton-restar:hover {
            background: rgba(57, 255, 136, 0.13);
            box-shadow: 0 0 18px rgba(57, 255, 136, 0.1);
        }

        .boton-reiniciar {
            color: var(--rosa-neon);
            background: rgba(255, 60, 172, 0.06);
            border-color: rgba(255, 60, 172, 0.3);
        }

        .boton-reiniciar:hover {
            background: rgba(255, 60, 172, 0.13);
            box-shadow: 0 0 18px rgba(255, 60, 172, 0.1);
        }

        footer {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid rgba(148, 163, 184, 0.12);
            color: #64748b;
            font-size: 11px;
            line-height: 1.7;
        }

        @media (max-width: 380px) {
            .contenedor {
                padding: 30px 20px;
            }

            h1 {
                font-size: 25px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                scroll-behavior: auto !important;
                transition: none !important;
            }
        }
    </style>
</head>

<body>
    <main class="contenedor">
        <div class="etiqueta">EVENTOS ESCOLARES</div>

        <h1>Colegio <span>Bolívar</span></h1>

        <p class="descripcion">
            Contador interactivo para registrar la participación
            en nuestros eventos.
        </p>

        <section class="contador-panel" aria-label="Contador de clicks">
            <p class="contador-label">Clicks registrados</p>

            <div
                class="contador"
                id="contador"
                role="status"
                aria-live="polite"
                aria-atomic="true"
            >0</div>

            <p class="estado" id="mensaje" aria-live="polite">
                ¡Listos para comenzar!
            </p>
        </section>

        <div class="botones">
            <button
                class="boton-sumar"
                id="sumar"
                type="button"
            >
                + Registrar click
            </button>

            <button
                class="boton-restar"
                id="restar"
                type="button"
            >
                − Restar click
            </button>

            <button
                class="boton-reiniciar"
                id="reiniciar"
                type="button"
            >
                ↻ Reiniciar contador
            </button>
        </div>

        <footer>
            COLEGIO BOLÍVAR<br>
            Tecnología · Participación · Comunidad
        </footer>
    </main>

    <script>
        // Estado inicial del contador
        let clicks = 0;

        // Referencias a los elementos HTML
        const contador = document.getElementById("contador");
        const mensaje = document.getElementById("mensaje");
        const botonSumar = document.getElementById("sumar");
        const botonRestar = document.getElementById("restar");
        const botonReiniciar = document.getElementById("reiniciar");

        // Actualiza el número, el mensaje y la animación
        function actualizarContador() {
            contador.textContent = clicks;

            if (clicks === 0) {
                mensaje.textContent = "¡Listos para comenzar!";
            } else if (clicks === 1) {
                mensaje.textContent = "¡Primer click registrado!";
            } else {
                mensaje.textContent =
                    `¡${clicks} clicks registrados!`;
            }

            // Reinicia la animación visual
            contador.classList.remove("animar");
            void contador.offsetWidth;
            contador.classList.add("animar");
        }

        // Registrar un click
        botonSumar.addEventListener("click", function () {
            clicks++;
            actualizarContador();
        });

        // Restar un click sin permitir números negativos
        botonRestar.addEventListener("click", function () {
            if (clicks > 0) {
                clicks--;
                actualizarContador();
            } else {
                mensaje.textContent =
                    "El contador ya está en cero.";
            }
        });

        // Reiniciar el contador
        botonReiniciar.addEventListener("click", function () {
            clicks = 0;
            actualizarContador();
        });
    </script>
</body>
</html>

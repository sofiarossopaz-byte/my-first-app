<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#080d1b">
    <title>Contador de Eventos | Colegio Bolívar</title>

    <style>
        :root {
            --fondo: #080d1b;
            --panel: #111a2e;
            --azul-neon: #00e5ff;
            --verde-neon: #39ffb6;
            --rosa-neon: #ff3cac;
            --texto: #f0f6ff;
            --texto-secundario: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
            font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background:
                radial-gradient(circle at top left, rgba(0, 229, 255, 0.10), transparent 35%),
                radial-gradient(circle at bottom right, rgba(57, 255, 182, 0.08), transparent 35%),
                var(--fondo);
            color: var(--texto);
        }

        .contador-container {
            width: 100%;
            max-width: 460px;
            padding: 36px 28px;
            text-align: center;
            background: rgba(17, 26, 46, 0.95);
            border: 1px solid rgba(0, 229, 255, 0.22);
            border-radius: 24px;
            box-shadow: 0 0 35px rgba(0, 229, 255, 0.08),
                        0 20px 60px rgba(0, 0, 0, 0.4);
        }

        .etiqueta {
            display: inline-block;
            margin-bottom: 18px;
            padding: 7px 14px;
            border: 1px solid rgba(0, 229, 255, 0.35);
            border-radius: 30px;
            color: var(--azul-neon);
            background: rgba(0, 229, 255, 0.07);
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 2px;
        }

        h1 {
            margin-bottom: 12px;
            font-size: clamp(25px, 5vw, 32px);
            font-weight: 800;
            overflow-wrap: anywhere;
        }

        .subtitulo {
            color: var(--texto-secundario);
            font-size: 15px;
            line-height: 1.6;
        }

        /* Campo para cambiar el título */
        .editor-titulo {
            margin-top: 28px;
            text-align: left;
        }

        .editor-titulo label {
            display: block;
            margin-bottom: 9px;
            color: var(--texto-secundario);
            font-size: 13px;
            font-weight: 600;
        }

        #tituloEvento {
            width: 100%;
            padding: 13px 15px;
            border: 1px solid rgba(0, 229, 255, 0.35);
            border-radius: 10px;
            outline: none;
            background: #080d1b;
            color: var(--texto);
            font: inherit;
            font-size: 14px;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        #tituloEvento:focus {
            border-color: var(--azul-neon);
            box-shadow: 0 0 14px rgba(0, 229, 255, 0.15);
        }

        .contador-display {
            margin: 28px 0;
            padding: 28px 15px;
            background: rgba(8, 13, 27, 0.8);
            border: 1px solid rgba(0, 229, 255, 0.15);
            border-radius: 18px;
        }

        .contador-label {
            display: block;
            margin-bottom: 12px;
            color: var(--texto-secundario);
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 3px;
        }

        #contador {
            color: var(--azul-neon);
            font-size: clamp(64px, 15vw, 88px);
            font-weight: 800;
            line-height: 1.1;
            font-variant-numeric: tabular-nums;
            text-shadow: 0 0 25px rgba(0, 229, 255, 0.45);
            transition: transform 0.15s ease;
        }

        #contador.animar {
            transform: scale(1.08);
        }

        .botones {
            display: flex;
            flex-direction: column;
            gap: 13px;
        }

        button {
            width: 100%;
            min-height: 52px;
            padding: 14px 20px;
            border: 1px solid transparent;
            border-radius: 12px;
            font-family: inherit;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s, background 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
        }

        button:active {
            transform: scale(0.98);
        }

        button:focus-visible {
            outline: 3px solid #ffffff;
            outline-offset: 4px;
        }

        #botonSumar {
            color: #06121d;
            background: var(--azul-neon);
            box-shadow: 0 0 18px rgba(0, 229, 255, 0.22);
        }

        #botonSumar:hover {
            background: #69efff;
            box-shadow: 0 0 28px rgba(0, 229, 255, 0.45);
        }

        #botonRestar {
            color: var(--verde-neon);
            background: rgba(57, 255, 182, 0.06);
            border-color: rgba(57, 255, 182, 0.45);
        }

        #botonRestar:hover {
            background: rgba(57, 255, 182, 0.14);
        }

        #botonReiniciar {
            color: var(--rosa-neon);
            background: rgba(255, 60, 172, 0.06);
            border-color: rgba(255, 60, 172, 0.4);
        }

        #botonReiniciar:hover {
            background: rgba(255, 60, 172, 0.14);
            box-shadow: 0 0 20px rgba(255, 60, 172, 0.12);
        }

        #mensaje {
            min-height: 24px;
            margin-top: 22px;
            color: var(--texto-secundario);
            font-size: 13px;
            line-height: 1.6;
        }

        footer {
            margin-top: 28px;
            padding-top: 20px;
            border-top: 1px solid rgba(148, 163, 184, 0.12);
            color: #64748b;
            font-size: 12px;
        }

        footer span {
            color: var(--azul-neon);
        }

        @media (max-width: 400px) {
            .contador-container {
                padding: 28px 20px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                transition-duration: 0.01ms !important;
                animation-duration: 0.01ms !important;
            }
        }
    </style>
</head>

<body>
    <main class="contador-container">
        <span class="etiqueta">EVENTOS ESCOLARES</span>

        <h1 id="tituloVisible">Colegio Bolívar</h1>

        <p class="subtitulo">Contador interactivo de eventos</p>

        <div class="editor-titulo">
            <label for="tituloEvento">Título del evento</label>
            <input
                type="text"
                id="tituloEvento"
                placeholder="Escribe el nombre del evento..."
                value="Colegio Bolívar"
                maxlength="80"
                autocomplete="off"
            >
        </div>

        <section class="contador-display" aria-label="Contador de clicks">
            <span class="contador-label">TOTAL DE CLICKS</span>

            <div
                id="contador"
                role="status"
                aria-live="polite"
                aria-atomic="true"
            >0</div>
        </section>

        <div class="botones">
            <button id="botonSumar" type="button">
                + &nbsp; Registrar click
            </button>

            <button id="botonRestar" type="button">
                − &nbsp; Restar click
            </button>

            <button id="botonReiniciar" type="button">
                ↻ &nbsp; Reiniciar contador a cero
            </button>
        </div>

        <p id="mensaje" role="status" aria-live="polite">
            ¡Listos para comenzar!
        </p>

        <footer>
            <span>●</span> Colegio Bolívar · Contador de eventos
        </footer>
    </main>

    <script>
        // Estado del contador
        let clicks = 0;

        // Referencias a los elementos HTML
        const contador = document.getElementById("contador");
        const mensaje = document.getElementById("mensaje");
        const botonSumar = document.getElementById("botonSumar");
        const botonRestar = document.getElementById("botonRestar");
        const botonReiniciar = document.getElementById("botonReiniciar");
        const tituloEvento = document.getElementById("tituloEvento");
        const tituloVisible = document.getElementById("tituloVisible");

        // Actualizar el contador y el mensaje
        function actualizarContador() {
            contador.textContent = clicks;

            if (clicks === 0) {
                mensaje.textContent = "¡Listos para comenzar!";
            } else if (clicks === 1) {
                mensaje.textContent = "¡Se ha registrado 1 click!";
            } else {
                mensaje.textContent =
                    `¡Se han registrado ${clicks} clicks!`;
            }
        }

        // Animación del número
        function animarContador() {
            contador.classList.remove("animar");
            void contador.offsetWidth;
            contador.classList.add("animar");
        }

        // Cambiar el título en tiempo real mientras se escribe
        tituloEvento.addEventListener("input", function () {
            const nuevoTitulo = tituloEvento.value.trim();
            tituloVisible.textContent = nuevoTitulo || "Nombre del evento";
            document.title = nuevoTitulo
                ? `${nuevoTitulo} | Contador de Eventos`
                : "Contador de Eventos | Colegio Bolívar";
        });

        // Sumar un click
        botonSumar.addEventListener("click", function () {
            clicks++;
            actualizarContador();
            animarContador();
        });

        // Restar un click sin permitir números negativos
        botonRestar.addEventListener("click", function () {
            if (clicks > 0) {
                clicks--;
                actualizarContador();
                animarContador();
            } else {
                mensaje.textContent =
                    "El contador no puede ser negativo.";
            }
        });

        // Reiniciar el contador a cero
        botonReiniciar.addEventListener("click", function () {
            clicks = 0;
            actualizarContador();
            animarContador();
            mensaje.textContent = "Contador reiniciado a cero.";
        });

        // Inicializar la interfaz
        actualizarContador();
    </script>
</body>
</html>
